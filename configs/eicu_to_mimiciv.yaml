dataset:
  name: eicu_to_mimiciv
  base_dir: raw/eicu
  files:
    patient: patient.csv.gz
    lab: lab.csv.gz
    vital_periodic: vitalPeriodic.csv.gz
    vital_aperiodic: vitalAperiodic.csv.gz
  cohort:
    min_age: 18
    min_stay_hours: 24
    max_age: 89
  competing_risks:
    enabled: true
    post_icu_death_source: null
    outcome_mapping:
      0: Censored (ICU discharge, or truncated at H)
      1: In-ICU death
      3: ICU discharge alive
  cache_dir: cache/eicu
preprocessing:
  mask_post_event_windows: true
  num_windows: 6
  window_size_hours: 4
  max_hours: 24
  max_carry_forward_hours: 24
  max_horizon_hours: 240
  n_time_bins: 10
  discretisation_method: quantiles
  missingness_threshold: 0.01
  event_col: event
  duration_col: duration
  imputation:
    static: mean
    dynamic: zero
  scaling:
    method: standard
    z_clip: 10.0
  landmarking:
    enabled: false
splits:
  train: 0.7
  val: 0.1
  test: 0.2
  seed: 42
  split_by: patient
modalities:
  timeseries: true
  static: true
  icd: false
  radiology: false
compute:
  backend: cpu
  gpu_chunksize: 5000000
evaluation:
  discharge_as: censored
  censor_causes:
  - 3
output:
  dir: arrays/transfer_eicu_to_mimiciv
  prefix: eicu_to_mimiciv
  files:
    x_train: x_train_eicu_to_mimiciv.npy
    x_val: x_val_eicu_to_mimiciv.npy
    x_test: x_test_eicu_to_mimiciv.npy
    train_mask: x_train_eicu_to_mimiciv_mask.npy
    val_mask: x_val_eicu_to_mimiciv_mask.npy
    test_mask: x_test_eicu_to_mimiciv_mask.npy
    y_train: y_train_surv_eicu_to_mimiciv.p
    y_val: y_val_surv_eicu_to_mimiciv.p
    y_test: y_test_surv_eicu_to_mimiciv.p
    durations_test: durations_test_eicu_to_mimiciv.npy
    events_test: events_test_eicu_to_mimiciv.npy
    cuts: cuts_eicu_to_mimiciv.npy
    feature_names: feature_names_eicu_to_mimiciv.pkl
    modality_info: modality_info_eicu_to_mimiciv.pkl
    scaler_dynamic: scaler_dynamic_eicu_to_mimiciv.pkl
    scaler_static: scaler_static_eicu_to_mimiciv.pkl
